[package]
name = "alvr_profiling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Low-overhead frame pipeline profiling for ALVR (env ring buffer + optional Tracy)"

[features]
default = []
# Optional Tracy zones when building with --features tracy (or via server_core/trace-performance)
tracy = ["dep:tracy-client"]

[dependencies]
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.tracy-client]
version = "0.17"
optional = true
default-features = false
features = ["enable"]
